[package]
name = "wenku8"
version = "0.1.0"
edition = "2024"

[dependencies]
encoding_rs = { version = "0.8", default-features = false, features = ["alloc"] }
aidoku = { git = "https://github.com/Aidoku/aidoku-rs.git", features = ["helpers"] }

[lib]
crate-type = ["cdylib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
strip = true
lto = true
